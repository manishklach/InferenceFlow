name: Hourly GPU and CPU rate history

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compute-rate-history
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify history and GET-only collection contracts
        run: python -m unittest tests.test_gpu_rate_history tests.test_compute_price_collection -q
      - name: Fetch fresh catalog quotes and append history
        env:
          RUNPOD_PRICING_API_KEY: ${{ secrets.RUNPOD_PRICING_API_KEY }}
        run: python -m scripts.collect_compute_prices
      - name: Commit only generated public price records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/gpu-rates/observations.jsonl docs/gpu-rates/hourly.csv docs/gpu-rates/daily.csv docs/gpu-rates/latest.md docs/gpu-rates/rates.svg docs/cpu-rates/observations.jsonl docs/cpu-rates/hourly.csv docs/cpu-rates/daily.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record hourly GPU and CPU quotes [skip ci]'
          # No force-push: a conflicting update fails and preserves a snapshot artifact.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
      - name: Preserve collected public records if publication fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compute-prices-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .runtime/pricing-snapshot.json
            docs/gpu-rates/observations.jsonl
            docs/cpu-rates/observations.jsonl
