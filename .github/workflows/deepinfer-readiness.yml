name: DeepInfer CPU source rehearsal (no GPU)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-rehearsal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install platform dependencies only
        run: python -m pip install -r requirements.lock
      - name: Fetch exact public source without executing its code
        run: |
          mkdir -p .runtime/deepinfer-ci/source .runtime/deepinfer-ci/reports
          git -C .runtime/deepinfer-ci/source init -q
          git -C .runtime/deepinfer-ci/source config core.autocrlf false
          git -C .runtime/deepinfer-ci/source remote add origin https://github.com/deepseek-ai/DeepInfer.git
          git -C .runtime/deepinfer-ci/source fetch --depth 1 origin 553741557a57df44a46fb3ab72b6aafeaf945337
          git -C .runtime/deepinfer-ci/source checkout --detach FETCH_HEAD
      - name: Verify source contract and vendor gitlink pins
        run: >-
          python -m scripts.deepinfer_preflight source
          --source .runtime/deepinfer-ci/source
          --output .runtime/deepinfer-ci/reports/source-audit.json
      - name: Parse Python and Bash without importing DeepInfer
        run: >-
          python infra/throughput/deepinfer/syntax_rehearsal.py
          --source .runtime/deepinfer-ci/source
          > .runtime/deepinfer-ci/reports/cpu-syntax.json
      - name: Test actual-token accounting and qualification contracts
        run: python -m unittest tests.test_deepinfer_preflight tests.test_throughput_profiles -q
      - name: Preserve public nonsecret rehearsal reports only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepinfer-cpu-rehearsal-${{ github.run_id }}
          path: .runtime/deepinfer-ci/reports/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
