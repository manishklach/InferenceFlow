name: Experiment read-key preflight (no GPU)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    environment: staging-experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Verify read-only experiment authentication
        env:
          RUNPOD_EXPERIMENT_READ_KEY: ${{ secrets.RUNPOD_EXPERIMENT_READ_KEY }}
        run: python -m scripts.experiment_read_preflight
