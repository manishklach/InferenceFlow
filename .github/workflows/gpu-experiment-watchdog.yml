name: GPU experiment independent watchdog

on:
  workflow_dispatch:
    inputs:
      cleanup_plan_json:
        description: 'Reviewed exact experiment identity and all-in cost plan (no secrets). Cleanup only; never creates a pod.'
        required: true
        type: string

permissions:
  contents: read

# Never cancel a watchdog when someone dispatches another one.
concurrency:
  group: gpu-experiment-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    environment: gpu-experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      CLEANUP_PLAN_JSON: ${{ inputs.cleanup_plan_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Arm exact experiment cleanup and monitor
        env:
          RUNPOD_CLEANUP_API_KEY: ${{ secrets.RUNPOD_CLEANUP_API_KEY }}
        run: python -m scripts.prearmed_cleanup
      - name: Final exact experiment cleanup on completion, failure or cancellation
        if: always()
        timeout-minutes: 3
        env:
          RUNPOD_CLEANUP_API_KEY: ${{ secrets.RUNPOD_CLEANUP_API_KEY }}
        run: python -m scripts.prearmed_cleanup --finalize
