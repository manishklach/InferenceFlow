name: Hosted policy controls (mock only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/experiment_policy.py
      - scripts/experiment_commands.py
      - scripts/rehearse_policy_controls.py
      - .github/workflows/policy-rehearsal.yml
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest tests.test_experiment_policy tests.test_experiment_commands -q
      - run: python -m scripts.rehearse_policy_controls
        env:
          HOST_COMMAND_GITHUB_TOKEN: ${{ github.token }}
      - name: Always clean the exact disposable Compose project
        if: always()
        run: docker compose -f infra/github-staging/compose.yml down --volumes --timeout 15 >/dev/null 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: mock-policy-rehearsal
          path: .runtime/policy-rehearsal.json
          include-hidden-files: true
          retention-days: 7
