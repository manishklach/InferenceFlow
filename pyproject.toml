[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "inferenceflow"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.45", "psycopg[binary]==3.2.9", "alembic==1.16.1", "httpx==0.28.1", "pydantic-settings==2.9.1", "cryptography==45.0.3", "PyJWT[crypto]==2.10.1", "stripe==12.2.0", "prometheus-client==0.22.0"]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.11.11", "mypy==1.15.0"]
gpu = ["transformers==4.51.3", "jinja2==3.1.6"]
observability = ["opentelemetry-sdk==1.33.1", "opentelemetry-exporter-otlp-proto-http==1.33.1", "opentelemetry-instrumentation-fastapi==0.54b1"]
[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["stripe.*", "transformers.*"]
follow_imports = "skip"
