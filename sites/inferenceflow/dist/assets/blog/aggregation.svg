<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">Cross-customer workload aggregation</title><desc id="desc">Three customers with 30, 45 and 60 minute targets submit compatible work to a shared queue, a deadline-aware scheduler and GPU workers. Conceptual design, not a service guarantee.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#63866c"/></marker></defs><rect width="920" height="480" fill="#edf1e6"/><style>text{font-family:Arial,sans-serif;fill:#184c3b}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#536b57}.wire{fill:none;stroke:#63866c;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f7f8f2;stroke:#c5d4bd;rx:10}</style><text x="35" y="42" class="small">01 / CROSS-CUSTOMER WORKLOAD AGGREGATION</text><rect x="35" y="85" width="195" height="75" class="box"/><text x="53" y="115" class="label">Customer A</text><text x="53" y="141" class="small">Target: 30 minutes</text><rect x="35" y="200" width="195" height="75" class="box"/><text x="53" y="230" class="label">Customer B</text><text x="53" y="256" class="small">Target: 45 minutes</text><rect x="35" y="315" width="195" height="75" class="box"/><text x="53" y="345" class="label">Customer C</text><text x="53" y="371" class="small">Target: 60 minutes</text><path class="wire" d="M230 122H265V237H302M230 237H302M230 352H265V237"/><rect x="305" y="188" width="170" height="100" class="box"/><text x="324" y="220" class="label">Shared queue</text><text x="324" y="249" class="small">Compatible model</text><text x="324" y="272" class="small">Tenant isolation</text><path class="wire" d="M475 237H508"/><rect x="512" y="170" width="175" height="135" rx="10" fill="#184c3b"/><text x="530" y="205" style="fill:#d8f07b" class="label">Deadline-aware</text><text x="530" y="232" style="fill:#d8f07b" class="label">scheduler</text><text x="530" y="266" style="fill:#f7f8f2;font-size:16px">Affinity · Fairness</text><text x="530" y="288" style="fill:#f7f8f2;font-size:16px">Capacity estimates</text><path class="wire" d="M687 237H715V130H747M715 237H747M715 237V344H747"/><rect x="751" y="100" width="135" height="60" class="box"/><text x="768" y="137" class="label">GPU worker</text><rect x="751" y="207" width="135" height="60" class="box"/><text x="768" y="244" class="label">GPU worker</text><rect x="751" y="314" width="135" height="60" class="box"/><text x="768" y="351" class="label">GPU worker</text><text x="35" y="443" class="small">CONCEPTUAL DESIGN / Completion targets are not guaranteed SLAs.</text></svg>