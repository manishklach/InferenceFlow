<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">InferenceFlow and vLLM responsibilities</title><desc id="desc">InferenceFlow orchestrates aggregation, deadlines, GPU selection, capacity planning and billing. vLLM owns continuous batching, model execution and token generation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#63866c"/></marker></defs><rect width="920" height="480" fill="#edf1e6"/><style>text{font-family:Arial,sans-serif;fill:#184c3b}.label{font-size:19px;font-weight:600}.small{font-size:16px;fill:#536b57}.wire{fill:none;stroke:#63866c;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f7f8f2;stroke:#c5d4bd;rx:10}</style><text x="35" y="42" class="small">02 / TWO LAYERS, DIFFERENT RESPONSIBILITIES</text><rect x="35" y="75" width="850" height="170" rx="12" fill="#184c3b"/><text x="60" y="115" style="fill:#d8f07b;font-size:29px">InferenceFlow</text><text x="60" y="143" style="fill:#f7f8f2;font-size:17px">Workload orchestration / engineering direction</text><text x="60" y="186" style="fill:#f7f8f2;font-size:19px">Workload aggregation · Deadline-aware scheduling</text><text x="60" y="218" style="fill:#f7f8f2;font-size:19px">GPU selection · Capacity planning · Billing</text><path class="wire" d="M460 245V282"/><rect x="35" y="290" width="850" height="125" class="box"/><text x="60" y="331" style="font-size:29px">vLLM</text><text x="60" y="370" class="label">Continuous batching · Model execution · Token generation</text><text x="35" y="453" class="small">vLLM provides continuous batching. InferenceFlow does not reinvent it.</text></svg>